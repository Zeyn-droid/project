name: Build BlizzardSkinBridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-skin-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B -f plugin/pom.xml clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlizzardSkinBridge
          path: plugin/target/BlizzardSkinBridge.jar
          if-no-files-found: error